<!DOCTYPE html>

<title>Active Workout - V Crunch</title>

<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col antialiased">
<!-- Top Header & Progress -->
<header class="px-container-margin py-4 w-full top-0 sticky bg-surface z-10 flex flex-col gap-4">
<div class="flex justify-between items-center w-full">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">close</span>
</button>
<div class="font-label-caps text-label-caps text-on-surface-variant">
                Exercise 3 of 12
            </div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<!-- Progress Bar -->
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed w-1/4 rounded-full transition-all duration-300 relative after:content-[''] after:absolute after:inset-0 after:bg-primary-fixed after:blur-[4px] after:opacity-30"></div>
</div>
</header>
<!-- Main Workout Canvas -->
<main class="flex-1 flex flex-col justify-center px-container-margin py-stack-lg gap-stack-lg relative overflow-hidden">
<!-- Illustration Area (Placeholder for V Crunch animation/graphic) -->
<div class="relative w-full aspect-square max-w-md mx-auto bg-surface-container border border-outline-variant/20 rounded-[24px] flex items-center justify-center overflow-hidden shadow-[inset_0_0_40px_rgba(0,0,0,0.5)]">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface-container-lowest/80 z-0"></div>
<img class="w-full h-full object-cover opacity-80 z-0" data-alt="A 3D stylized render of a professional athlete performing a V-crunch on a dark studio background. High-contrast lighting with an electric lime green rim light outlining the figure against deep black. The mood is intense, focused, and powerful, matching a premium modern fitness app dark mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwpfC64WK-T1GO3QP8cI9J_K7GU-HnOVcJMJhO3RBTCHMGB_ewLjWv6itcniK400TFVAS0io_NPHkIQ7FcLz2GJ8vhBXOw0v1IXzrAf5t-CJEkpwsgjhifVsPyOG5IpzM0QgLqKlxPSjx69jlC5oqFapFS8GwvjqGZLeQgDHyTk6tfuY_x8GEYPUsIGVxhg0ya9xeQqNA7M-OX5G02CpfrlQyUsskEut54mc7RMgOMqJqpjs0WE8qlLQ"/>
<div class="absolute bottom-4 left-4 right-4 z-10 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">V CRUNCH</h1>
<div class="flex items-center justify-center gap-2 mt-2">
<span class="px-3 py-1 bg-surface-container-high/50 backdrop-blur-md rounded-full font-label-caps text-label-caps text-on-surface-variant border border-outline-variant/30">CORE</span>
<span class="px-3 py-1 bg-surface-container-high/50 backdrop-blur-md rounded-full font-label-caps text-label-caps text-on-surface-variant border border-outline-variant/30">STRENGTH</span>
</div>
</div>
</div>
<!-- Metrics & Coaching -->
<div class="flex flex-col items-center gap-stack-sm text-center">
<div class="font-display-lg text-display-lg text-primary-fixed tabular-nums tracking-tighter" style="text-shadow: 0 0 20px rgba(190, 245, 0, 0.2);">
                x 16
            </div>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs text-balance">
                Keep your core tight and move slowly.
            </p>
</div>
<!-- Controls -->
<div class="flex items-center justify-center gap-8 mt-auto pt-stack-md pb-stack-lg">
<button class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors border border-outline-variant/20 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<button class="w-20 h-20 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed transition-transform hover:scale-105 active:scale-95 shadow-[0_0_20px_rgba(190,245,0,0.3)]">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors border border-outline-variant/20 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
</main>
<!-- Bottom Action -->
<div class="px-container-margin pb-container-margin pt-4 bg-surface/80 backdrop-blur-xl border-t border-outline-variant/10 z-20">
<button class="w-full h-[64px] bg-surface-container-highest text-primary-fixed font-title-md text-title-md rounded-[16px] border border-outline-variant/30 hover:bg-surface-container-high transition-colors active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            DONE
        </button>
</div>
