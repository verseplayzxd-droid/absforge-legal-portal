                      "on-primary": "#273500",
                      "inverse-on-surface": "#2f3034",

                      "tertiary-container": "#e4e2e4",

              "fontFamily": {
                      "body-sm": ["Inter"],
                      "body-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],

              "fontSize": {

          }
        }
      </script>
<style>
          .glass-panel {
              background: rgba(28, 28, 30, 0.8);
              backdrop-filter: blur(12px);
              -webkit-backdrop-filter: blur(12px);
              border: 1px solid rgba(255, 255, 255, 0.05);
          }
          .glow-ring {
              box-shadow: 0 0 15px rgba(198, 255, 0, 0.2);
          }
      </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 font-body-lg">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface w-full top-0 sticky z-40 flat no shadows flex justify-between items-center px-container-margin py-4 transition-all duration-200">
<button class="text-on-surface-variant hover:opacity-80 active:scale-95 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-display-lg text-display-lg font-black text-primary-fixed tracking-tighter">ABSFORGE</h1>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant/30 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
</header>
<main class="px-container-margin pt-stack-sm pb-stack-lg max-w-4xl mx-auto">
<!-- Header Section -->
<div class="mb-stack-lg flex flex-col items-center text-center">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">30 Day Abs Challenge</h2>
<!-- Progress Indicator -->
<div class="w-full max-w-xs mt-4">
<div class="flex justify-between items-end mb-2">
<span class="font-label-caps text-label-caps text-on-surface-variant">PROGRESS</span>
<span class="font-title-md text-title-md text-primary-fixed">23% Complete</span>
</div>
<div class="w-full h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary-fixed rounded-full" style="width: 23%;"></div>
</div>
</div>
</div>
<!-- Level Selector -->
<div class="glass-panel rounded-xl p-1 mb-stack-lg flex justify-between max-w-md mx-auto">
<button class="flex-1 py-2 px-4 rounded-lg text-center font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors">Beginner</button>
<button class="flex-1 py-2 px-4 rounded-lg text-center font-label-caps text-label-caps bg-surface-container-highest text-primary shadow-sm border border-outline-variant/20 transition-colors">Intermediate</button>
<button class="flex-1 py-2 px-4 rounded-lg text-center font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors">Advanced</button>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-4 md:grid-cols-6 gap-3">
<!-- Days 1-6 Checked -->
<div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center relative overflow-hidden border-primary-fixed/30 bg-primary-fixed/5">
<span class="font-title-md text-title-md text-primary opacity-50">1</span>
<span class="material-symbols-outlined text-primary-fixed absolute inset-0 m-auto flex items-center justify-center" style="font-variation-settings: 'FILL' 1; font-size: 32px;">check_circle</span>
</div>
<div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center relative overflow-hidden border-primary-fixed/30 bg-primary-fixed/5">
<span class="font-title-md text-title-md text-primary opacity-50">2</span>
<span class="material-symbols-outlined text-primary-fixed absolute inset-0 m-auto flex items-center justify-center" style="font-variation-settings: 'FILL' 1; font-size: 32px;">check_circle</span>
</div>
<div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center relative overflow-hidden border-primary-fixed/30 bg-primary-fixed/5">
<span class="font-title-md text-title-md text-primary opacity-50">3</span>
<span class="material-symbols-outlined text-primary-fixed absolute inset-0 m-auto flex items-center justify-center" style="font-variation-settings: 'FILL' 1; font-size: 32px;">check_circle</span>
</div>
<div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center text-center p-2 border-outline-variant/30">
<span class="font-title-md text-title-md text-on-surface-variant opacity-60">4</span>
<span class="font-label-caps text-[10px] text-on-surface-variant mt-1">REST</span>
</div>
<div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center relative overflow-hidden border-primary-fixed/30 bg-primary-fixed/5">
<span class="font-title-md text-title-md text-primary opacity-50">5</span>
<span class="material-symbols-outlined text-primary-fixed absolute inset-0 m-auto flex items-center justify-center" style="font-variation-settings: 'FILL' 1; font-size: 32px;">check_circle</span>
</div>
<div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center relative overflow-hidden border-primary-fixed/30 bg-primary-fixed/5">
<span class="font-title-md text-title-md text-primary opacity-50">6</span>
<span class="material-symbols-outlined text-primary-fixed absolute inset-0 m-auto flex items-center justify-center" style="font-variation-settings: 'FILL' 1; font-size: 32px;">check_circle</span>
</div>
<!-- Day 7 TODAY Highlight -->
<div class="aspect-square bg-surface-container-high rounded-xl flex flex-col items-center justify-center border-2 border-primary-fixed glow-ring relative">
<div class="absolute -top-2 bg-primary-fixed text-on-primary-fixed font-label-caps text-[10px] px-2 py-0.5 rounded-full">TODAY</div>
<span class="font-title-md text-title-md text-primary">7</span>
<span class="material-symbols-outlined text-primary-fixed mt-1 text-xl">play_circle</span>
</div>
<!-- Days 8-30 Locked -->
<div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center text-center p-2 border-outline-variant/30 text-on-surface-variant opacity-50">
<span class="font-title-md text-title-md">8</span>
<span class="font-label-caps text-[10px] mt-1">REST</span>
</div>
<!-- Generating remaining days dynamically to keep code concise but illustrative -->
<script>
                document.write(Array.from({length: 22}, (_, i) => {
                    const day = i + 9;
                    const isRest = day % 4 === 0;
                    return `
                    <div class="aspect-square glass-panel rounded-xl flex flex-col items-center justify-center text-center p-2 border-outline-variant/10 text-on-surface-variant opacity-40">
                        <span class="font-title-md text-title-md">${day}</span>
                        ${isRest ? `<span class="font-label-caps text-[10px] mt-1">REST</span>` : `<span class="material-symbols-outlined text-sm mt-1 opacity-50">lock</span>`}
                    </div>
                    `;
                }).join(''));
            </script>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl border-t border-outline-variant/10 shadow-lg bg-surface-container/80 backdrop-blur-xl dark:bg-surface-container/80 flex justify-around items-center px-4 py-3 transition-transform duration-300">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-primary-fixed relative after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-primary-fixed after:rounded-full hover:text-primary active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-label-caps text-label-caps">Workouts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1">monitoring</span>
<span class="font-label-caps text-label-caps">Progress</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
</body></html>
