<!DOCTYPE html>

<html class="dark" lang="en"><head>

                }
            }
        }

<style>
        .timer-circle {
            stroke-dasharray: 879; /* 2 * pi * r (r=140) */
            stroke-dashoffset: 220; /* Example progress */
            transition: stroke-dashoffset 1s linear;
        }
        
        /* Subtle glow for the timer progress */
        .timer-glow {
            filter: drop-shadow(0 0 12px rgba(198, 255, 0, 0.2));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Canvas Content -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-stack-lg w-full max-w-md mx-auto">
<!-- Rest Text -->
<div class="text-center mb-stack-lg w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">REST</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Recover and prepare for the next set.</p>
</div>
<!-- Huge Circular Timer -->
<div class="relative w-[300px] h-[300px] mb-stack-lg flex items-center justify-center shrink-0">
<!-- Background Ring (Dark Gray) -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90" viewbox="0 0 300 300">
<circle class="stroke-[#2C2C2E]" cx="150" cy="150" fill="none" r="140" stroke-width="12"></circle>
<!-- Progress Ring (Electric Lime) -->
<circle class="stroke-[#C6FF00] timer-circle timer-glow" cx="150" cy="150" fill="none" r="140" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Timer Text -->
<div class="text-center z-10 flex flex-col items-center">
<span class="font-display-lg text-display-lg text-primary tracking-tighter tabular-nums">00:30</span>
</div>
</div>
<!-- Next Exercise Preview Card -->
<div class="w-full bg-[#1C1C1E] rounded-[24px] border border-white/5 p-stack-md flex items-center gap-4 mb-stack-lg relative overflow-hidden shadow-[0_4px_24px_rgba(0,0,0,0.5)]">
<!-- Subtle accent glow -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary-fixed/5 rounded-full blur-2xl"></div>
<!-- Exercise Image -->
<div class="w-24 h-24 md:w-32 md:h-32 rounded-lg bg-surface-container-high overflow-hidden shrink-0 border border-white/5">
<img class="w-full h-full object-cover" data-alt="A focused close-up shot of a fitness model performing flutter kicks on a dark gym mat. The lighting is low-key and dramatic, casting deep shadows that highlight abdominal muscle definition. An electric lime edge light accents the athlete's sneakers and shorts. The overall aesthetic is gritty, professional, and modern, fitting a high-intensity dark-mode fitness app design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXiOr9tY8zvY5LINuBTAjzdnj5MzgSmf9EBJ91vGNatoJ4GZTaQEVx73SO0MUy3ArT5aEWFj1jEYb07jJ0ysLlHtoh1LKh3EPSFS_xdbgvKaA34RExFVgqUk5dBZ399Xm2NfyR58VL8e1a1Y9-sPxU9yVPSQcDKoJX046SqVVpPAu-D51NwlOO5tvNOEmL91R0AQDFoPVdHu7c-RYBySGcxIVkUQB1zGDdWmdHhCOjKVqMtI1efLkJ6g"/>
</div>
<!-- Exercise Details -->
<div class="flex-grow">
<p class="font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase tracking-widest">Next Exercise</p>
<h3 class="font-title-md text-title-md text-primary truncate">Flutter Kicks</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">timer</span>
                    30 sec
                </p>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full flex gap-4 mb-stack-lg">
<button class="flex-1 bg-[#1C1C1E] border border-white/5 hover:bg-[#2C2C2E] text-primary font-title-md text-title-md py-4 rounded-xl transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span>
                20 SEC
            </button>
<button class="flex-1 bg-[#C6FF00] hover:bg-[#a6d700] text-[#0A0A0A] font-title-md text-title-md font-bold py-4 rounded-xl transition-all duration-200 active:scale-95 flex items-center justify-center gap-2">
                SKIP
                <span class="material-symbols-outlined">skip_next</span>
</button>
</div>
<!-- Small Non-Intrusive Banner Ad Placeholder -->
<div class="w-full h-12 bg-surface-container-high/50 rounded-lg border border-outline-variant/30 flex items-center justify-center relative overflow-hidden mt-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant/50">Advertisement Space</span>
<div class="absolute top-1 right-1 bg-surface-container-highest px-1 rounded-sm">
<span class="font-label-caps text-[8px] leading-[10px] text-on-surface-variant">AD</span>
</div>
</div>
</main>
<!-- Suppressed TopAppBar and BottomNavBar as this is a focused, transactional timer screen -->
<script>
        // Simple script to animate the timer circle for demo purposes
        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.querySelector('.timer-circle');
            let offset = 879; // Total circumference
            
            // Simulate countdown visually
            setInterval(() => {
                offset -= 10;
                if (offset < 0) offset = 879;
                if(circle) {
                     circle.style.strokeDashoffset = offset;
                }
            }, 500);
        });
    </script>
</body></html>
