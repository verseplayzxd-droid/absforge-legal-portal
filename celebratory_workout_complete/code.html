<script>
        // Simple particle effect for celebration
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('particle-container');
            const colors = ['#C6FF00', '#FFFFFF', '#343539'];
            
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'absolute rounded-full opacity-0';
                
                // Randomize properties
                const size = Math.random() * 8 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const animDuration = Math.random() * 2 + 1;
                const delay = Math.random() * 0.5;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = color;
                particle.style.left = `${left}%`;
                particle.style.top = `${top}%`;
                
                // Set animation directly
                particle.style.animation = `float-up ${animDuration}s ease-out ${delay}s forwards`;
                
                container.appendChild(particle);
            }
        });
    </script>
<style>
        @keyframes float-up {
            0% { transform: translateY(50px) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }
        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
